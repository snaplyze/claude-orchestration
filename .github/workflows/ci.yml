name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12','3.13']
        include:
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: python scripts/doctor.py
      - name: PowerShell launcher smoke
        if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: pwsh
        run: |
          $t = (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'ps-smoke')).FullName
          ./setup.ps1 $t -Profile pro-balanced
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $t '.claude/plugins/orchestration/.claude-plugin/plugin.json'))) { throw 'plugin not installed' }
          ./setup.ps1 $t -Uninstall
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $t '.claude/plugins/orchestration')) { throw 'plugin not removed' }
          $m = Join-Path $env:RUNNER_TEMP 'ps-marketplace'
          ./setup.ps1 -User -Profile max-20x-thorough -MarketplaceDir $m
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $m '.claude-plugin/marketplace.json'))) { throw 'marketplace not built' }
          ./setup.ps1 -User -Uninstall -MarketplaceDir $m
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path $m) { throw 'marketplace not removed' }
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sh -n setup.sh
      - name: POSIX launcher smoke
        run: |
          t=$(mktemp -d)
          ./setup.sh "$t" --profile pro-balanced
          test -f "$t/.claude/plugins/orchestration/.claude-plugin/plugin.json"
          ./setup.sh "$t" --uninstall
          test ! -e "$t/.claude/plugins/orchestration"
          ./setup.sh --user --profile max-20x-thorough --marketplace-dir "$t/marketplace"
          test -f "$t/marketplace/.claude-plugin/marketplace.json"
          ./setup.sh --user --uninstall --marketplace-dir "$t/marketplace"
          test ! -e "$t/marketplace"
