name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # PR runs share a group per branch, so a new push cancels the superseded run; any other run (a push to main,
  # a manual dispatch) gets a group of its own commit and is never cancelled or replaced by a later one.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12','3.13']
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: python scripts/doctor.py
      - name: PowerShell launcher smoke
        if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: pwsh
        run: |
          $t = (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'ps-smoke')).FullName
          ./setup.ps1 $t -Profile pro-balanced
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $t '.claude/plugins/orchestration/.claude-plugin/plugin.json'))) { throw 'plugin not installed' }
          ./setup.ps1 $t -Uninstall
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $t '.claude/plugins/orchestration')) { throw 'plugin not removed' }
          $m = Join-Path $env:RUNNER_TEMP 'ps-marketplace'
          ./setup.ps1 -User -Profile max-20x-thorough -MarketplaceDir $m
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $m '.claude-plugin/marketplace.json'))) { throw 'marketplace not built' }
          ./setup.ps1 -User -Uninstall -MarketplaceDir $m
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path $m) { throw 'marketplace not removed' }
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'ps-config'
          ./setup.ps1 -DefaultRule
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR 'rules/claude-orchestration.md'))) { throw 'rule not installed' }
          ./setup.ps1 -DefaultRule -Uninstall
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR 'rules/claude-orchestration.md')) { throw 'rule not removed' }
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh -n setup.sh
      - name: POSIX launcher smoke
        run: |
          t=$(mktemp -d)
          ./setup.sh "$t" --profile pro-balanced
          test -f "$t/.claude/plugins/orchestration/.claude-plugin/plugin.json"
          ./setup.sh "$t" --uninstall
          test ! -e "$t/.claude/plugins/orchestration"
          ./setup.sh --user --profile max-20x-thorough --marketplace-dir "$t/marketplace"
          test -f "$t/marketplace/.claude-plugin/marketplace.json"
          ./setup.sh --user --uninstall --marketplace-dir "$t/marketplace"
          test ! -e "$t/marketplace"
          CLAUDE_CONFIG_DIR="$t/config" ./setup.sh --default-rule
          test -f "$t/config/rules/claude-orchestration.md"
          CLAUDE_CONFIG_DIR="$t/config" ./setup.sh --default-rule --uninstall
          test ! -e "$t/config/rules/claude-orchestration.md"
  plugin:
    # Claude Code's own validator; it needs no login, so this job has no secret.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code (pinned)
        run: npm install --global @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate --strict ./plugin
      - run: claude plugin validate --strict .
      - name: Generated user marketplace
        run: |
          t=$(mktemp -d)
          python3 scripts/install.py --user --profile max-20x-thorough --marketplace-dir "$t/marketplace"
          claude plugin validate --strict "$t/marketplace"
          claude plugin validate --strict "$t/marketplace/plugin"
